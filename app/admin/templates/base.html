<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ business_name }} — Panel{% endblock %}</title>
    <!-- Geist Font for Vercel-like sleekness -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --bg-card-hover: #171717;
            --accent: #ffffff;
            --accent-light: #e5e5e5;
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            --success: #34d399;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar */
        .navbar {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }

        .navbar-brand span {
            color: var(--text-primary);
        }
        
        .brand-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c9a96e, #111);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .navbar-logout {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .navbar-logout:hover {
            color: var(--text-primary);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            flex-grow: 1;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--text-secondary);
        }

        /* Forms */
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 1px var(--text-secondary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-family: var(--font-family);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-light);
            transform: scale(0.98);
        }
        
        .btn-outline {
            background-color: transparent;
            border-color: var(--border);
            color: var(--text-primary);
        }
        
        .btn-outline:hover {
            background-color: var(--bg-secondary);
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border-color: var(--border);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Cards */
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        .card-hover:hover {
            background-color: var(--bg-card-hover);
            border-color: #3f3f46;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if not hide_navbar %}
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/admin" class="navbar-brand">
                <div class="brand-logo">💈</div>
                <span>{{ business_name }}</span>
            </a>
            <a href="/admin/logout" class="navbar-logout">Cerrar Sesión</a>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
