<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TurnoFlow">
    <link rel="apple-touch-icon" href="/static/logo.PNG">
    
    <title>{% block title %}{{ business_name }} — Panel{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0a0a0a;
            --bg-card: rgba(20, 20, 20, 0.6);
            --bg-card-hover: rgba(30, 30, 30, 0.8);
            --accent: #ffffff;
            --accent-light: #e5e5e5;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --success: #10b981;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --glow-subtle: 0 0 20px rgba(255, 255, 255, 0.03);
            --glow-accent: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 30, 30, 0.4) 0%, transparent 70%);
            background-attachment: fixed;
        }

        /* Navbar */
        .navbar {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        
        .brand-logo-img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .navbar-logout {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
        }

        .navbar-logout:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.08);
            border-color: var(--border);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            flex-grow: 1;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--text-secondary);
        }

        /* Forms */
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: rgba(10,10,10,0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
            background-color: #111;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: var(--font-family);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: 1px solid transparent;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            box-shadow: 0 4px 14px 0 rgba(255,255,255,0.1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.2);
            background-color: #f0f0f0;
        }
        
        .btn-outline {
            background-color: rgba(255,255,255,0.03);
            border-color: var(--border);
            color: var(--text-primary);
            backdrop-filter: blur(4px);
        }
        
        .btn-outline:hover {
            background-color: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.05);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }

        /* Cards (Glassmorphism) */
        .card {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: var(--glow-subtle);
        }

        .card-hover:hover {
            background-color: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--glow-accent);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if not hide_navbar %}
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/admin" class="navbar-brand">
                <span>{{ business_name }}</span>
            </a>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <a href="/admin" class="navbar-logout">Inicio</a>
                <a href="/admin/historial" class="navbar-logout">Historial</a>
                <a href="/admin/configuracion" class="navbar-logout">Horarios</a>
                <a href="/admin/servicios" class="navbar-logout">Servicios</a>
                <a href="/admin/logout" class="navbar-logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
