{% extends "base.html" %}

{% block title %}Cambiar Contraseña — {{ business_name }}{% endblock %}

{% block extra_css %}
<style>
    .password-wrapper {
        max-width: 500px;
        margin: 0 auto;
    }
    
    .config-header {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
    }

    .success-msg {
        background-color: rgba(16, 185, 129, 0.1);
        color: var(--success);
        padding: 0.875rem;
        border-radius: 8px;
        font-size: 0.875rem;
        margin-bottom: 2rem;
        text-align: center;
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.05);
    }

    .error-msg {
        background-color: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        padding: 0.875rem;
        border-radius: 8px;
        font-size: 0.875rem;
        margin-bottom: 2rem;
        text-align: center;
        border: 1px solid rgba(239, 68, 68, 0.2);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="password-wrapper">
        <div class="card">
            <h2 class="config-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Cambiar Contraseña
            </h2>

            {% if success %}
            <div class="success-msg">{{ success_msg }}</div>
            {% endif %}

            {% if error %}
            <div class="error-msg">{{ error_msg }}</div>
            {% endif %}

            <form action="/admin/cambiar-password" method="POST">
                <input type="hidden" name="csrf_token" value="{{ get_csrf_token(request) }}">

                <div class="form-group">
                    <label for="current_password" class="form-label">Contraseña actual</label>
                    <input type="password" id="current_password" name="current_password" class="form-input" required placeholder="Tu contraseña actual">
                </div>
                <div class="form-group">
                    <label for="new_password" class="form-label">Nueva contraseña</label>
                    <input type="password" id="new_password" name="new_password" class="form-input" required minlength="4" placeholder="Mínimo 4 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirmar nueva contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="4" placeholder="Repetir nueva contraseña">
                </div>

                <button type="submit" class="btn-full" style="margin-top: 1.5rem; margin-bottom: 0;">Guardar Nueva Contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
