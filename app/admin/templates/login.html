{% extends "base.html" %}

{% block title %}Ingreso - {{ business_name }}{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background-color: var(--bg-primary);
        background-image: radial-gradient(circle at 50% 0%, rgba(30, 30, 30, 0.4) 0%, transparent 70%);
        z-index: 1000;
    }
    
    .login-card {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 3rem 2.5rem;
        position: relative;
        overflow: hidden;
    }
    
    /* Subtle highlight on top of the card */
    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    
    .login-header h1 {
        margin-bottom: 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.04em;
    }
    
    .login-header p {
        font-size: 0.95rem;
        color: var(--text-secondary);
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
    }
    
    .btn-login {
        width: 100%;
        padding: 0.875rem;
        font-size: 1rem;
        margin-top: 1rem;
    }
    
    .error-msg {
        background-color: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        padding: 0.875rem;
        border-radius: 8px;
        font-size: 0.875rem;
        margin-bottom: 2rem;
        text-align: center;
        border: 1px solid rgba(239, 68, 68, 0.2);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper fade-in">
    <div class="card login-card">
        <div class="login-header">
            <img src="/static/logo.PNG" alt="Logo" style="width: 64px; height: 64px; border-radius: 12px; margin: 0 auto 1.5rem; display: block; border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0,0,0,0.4); object-fit: cover;">
            <h1>Panel Exclusivo</h1>
            <p>Ingresá para gestionar la agenda</p>
        </div>
        
        {% if error %}
        <div class="error-msg">Usuario o contraseña incorrecta. Intenta nuevamente.</div>
        {% endif %}
        
        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label for="username">Usuario de la Empresa</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Ej. la_barberia">
            </div>
            <div class="form-group">
                <label for="password">Contraseña de acceso</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">Ingresar al panel</button>
        </form>
    </div>
</div>
{% endblock %}
